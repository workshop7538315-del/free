name: デッキビルダーを公開

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "cards/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # publishable キーはブラウザに公開される前提のキー。
      # 書き込み権限は Supabase の行レベルセキュリティで制限している。
      VITE_SUPABASE_URL: https://thiirwhjcpicrnmcsgws.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_tzzZ0tfKXgZqEOIlQAeilA_yd82DAzw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
